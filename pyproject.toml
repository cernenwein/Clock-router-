[project]
name = "clockrouter"
version = "0.1.0"
description = "A local-first, policy-controlled AI model router"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "openai>=2,<3",
  "pre-commit>=4.0,<5",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-xdist>=3.6,<4",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
required-version = "==0.12.11"
